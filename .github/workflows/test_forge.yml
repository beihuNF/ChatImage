name: 测试Forge

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'forge/**'
      - 'origin/**'
      - 'tool/**'
      - 'init.sh'
      - 'matrix.sh'
      - 'jdk_rules.sh'
      - 'version.txt'
      - '.github/workflows/test_forge.yml'
permissions:
  contents: read

env:
  JAVA_21_RULE: ">=fabric-1.16.5,>=neoforge-1.20.2"
  JAVA_17_RULE: ">=fabric-1.16.5,>=forge-1.17"
  JAVA_8_RULE: "=forge-1.16.5"

jobs:

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          chmod +x matrix.sh && ./matrix.sh -path "forge"

  test:
    runs-on: ubuntu-latest
    needs: generate-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Get JDK Version
        run: chmod +x jdk_rules.sh && ./jdk_rules.sh "${{ matrix.config.mc-loader }}" "${{ matrix.config.mc-version }}" "${{ env.JAVA_21_RULE }}" "${{ env.JAVA_17_RULE }}" "${{ env.JAVA_8_RULE }}"

      - name: Chose JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Read version.txt and save to variable
        run: |
          mod_version=$(cat version.txt)
          echo "Version: $mod_version"
          echo "MOD_VERSION=$mod_version" >> "$GITHUB_ENV"
      - name: Init Files
        run: |
          chmod +x init.sh && ./init.sh
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ matrix.config.mc-version }}+${{ matrix.config.mc-loader }}-gradle-
      - name: Build
        run: |
          cd ${{ matrix.config.mc-loader }}/${{ matrix.config.mc-loader }}-${{ matrix.config.mc-version }}
          chmod +x gradlew && ./gradlew clean build
          cd ../..
      - name: Show Files
        run: |
          ls ChatImage-jar/${{ env.MOD_VERSION }}
