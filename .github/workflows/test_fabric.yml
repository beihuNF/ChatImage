name: 测试 Fabric（三版本）

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'fabric/**'
      - 'origin/**'
      - 'version-overlays/**'
      - 'tool/**'
      - 'init.sh'
      - 'version.txt'
      - '.github/workflows/test_fabric.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.1"
            java: "25"
          - minecraft: "26.2"
            java: "25"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Initialize generated projects
        run: |
          chmod +x init.sh
          ./init.sh

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fabric-${{ matrix.minecraft }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            fabric-${{ matrix.minecraft }}-gradle-

      - name: Build Fabric ${{ matrix.minecraft }}
        working-directory: fabric/fabric-${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
