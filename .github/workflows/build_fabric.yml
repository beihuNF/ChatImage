name: 发布 Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.21.11"
            java: "21"
          - minecraft: "26.1"
            java: "25"
          - minecraft: "26.2"
            java: "25"
          - minecraft: "26.3"
            java: "25"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Read mod version
        run: echo "MOD_VERSION=$(<version.txt)" >> "$GITHUB_ENV"

      - name: Initialize generated projects
        run: |
          chmod +x init.sh
          ./init.sh

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: fabric-${{ matrix.minecraft }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            fabric-${{ matrix.minecraft }}-gradle-

      - name: Build Fabric ${{ matrix.minecraft }}
        working-directory: fabric/fabric-${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Fabric ${{ matrix.minecraft }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: fabric-${{ matrix.minecraft }}
          path: ChatImage-jar/${{ env.MOD_VERSION }}/ChatImage-${{ env.MOD_VERSION }}+${{ matrix.minecraft }}+fabric.jar
          if-no-files-found: error

  build-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Read mod version
        run: echo "MOD_VERSION=$(<version.txt)" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Legacy Forge 1.7.10
        working-directory: legacy/forge-1.7.10
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Legacy Forge 1.7.10 artifact
        uses: actions/upload-artifact@v7
        with:
          name: legacy-1.7.10
          path: ChatImage-jar/${{ env.MOD_VERSION }}/ChatImage-${{ env.MOD_VERSION }}+1.7.10+forge.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build, build-legacy]
    steps:
      - uses: actions/checkout@v7

      - name: Download all jars
        uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mod_version=$(<version.txt)
          tag="v${mod_version}"
          title="ChatImage ${mod_version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release upload "$tag" release-assets/*.jar --clobber
            gh release edit "$tag" --title "$title"
          else
            gh release create "$tag" release-assets/*.jar \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --generate-notes
          fi
